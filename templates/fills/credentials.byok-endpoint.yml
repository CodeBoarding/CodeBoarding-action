          # Your own {{LABEL}} endpoint: every run calls it directly.
          # {{LLM}} is selected by its endpoint rather than a key, so set
          # {{SELECTOR}} to the address CodeBoarding should reach it on. Until it
          # is set the run FAILS and says so. It does not fall back to a different
          # provider on CodeBoarding's hosted tier.
          llm: {{LLM}}
          {{SELECTOR}}: https://your-{{LLM}}-host
